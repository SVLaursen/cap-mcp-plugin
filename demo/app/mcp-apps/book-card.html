<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book card</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 0;
        padding: 16px;
      }
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        max-width: 360px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .meta {
        color: #666;
      }
      #error {
        color: #b00020;
      }
      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!--
      MCP App UI for CatalogService.bookCard (@mcp.ui: 'ui://bookshop/book-card.html').
      The host renders this page in an iframe and talks to it over postMessage (the MCP Apps
      bridge): the page asks ui/initialize, says ui/notifications/initialized, and the host sends
      the tool's result as ui/notifications/tool-result. The result's structuredContent is
      { value: <the book> }, or { error: { code, message } } when the call failed.
      No library needed; @modelcontextprotocol/ext-apps' App class does the same in a bundled app.
    -->
    <div class="card">
      <p id="error"></p>
      <div id="book">
        <h1 id="title"></h1>
        <div class="meta"><span id="author"></span> · <span id="price"></span></div>
        <p id="descr"></p>
        <div class="meta">In stock: <span id="stock"></span></div>
      </div>
    </div>
    <script>
      function render(result) {
        const set = (id, text) => (document.getElementById(id).textContent = text ?? "");
        const content = result.structuredContent ?? {};
        document.getElementById("book").hidden = !!result.isError;
        if (result.isError)
          return set("error", content.error?.message ?? result.content?.[0]?.text);
        const book = content.value ?? {};
        set("title", book.title);
        set("author", book.authorName);
        set("price", book.price === null || book.price === undefined ? "" : `€ ${book.price}`);
        set("descr", book.descr);
        set("stock", book.stock);
      }

      // The MCP Apps bridge (ext-apps protocol 2026-01-26): JSON-RPC over postMessage.
      (() => {
        const host = window.parent;
        const send = (message) => host.postMessage({ jsonrpc: "2.0", ...message }, "*");
        const size = () =>
          send({
            method: "ui/notifications/size-changed",
            params: { height: document.documentElement.scrollHeight },
          });
        window.addEventListener("message", ({ source, data }) => {
          if (source !== host || data?.jsonrpc !== "2.0") return;
          if (data.id === 1 && !data.method) send({ method: "ui/notifications/initialized" });
          if (data.method === "ui/notifications/tool-result") {
            render(data.params);
            size();
          }
        });
        send({
          id: 1,
          method: "ui/initialize",
          params: {
            appInfo: { name: "bookshop-book-card", version: "1.0.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          },
        });
      })();
    </script>
  </body>
</html>

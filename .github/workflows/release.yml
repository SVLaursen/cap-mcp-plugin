# Release & publish @gavdi/cap-mcp to npm (ported from v1's release workflow).
#
# Run by hand from the Actions tab ("Run workflow") on main. release-it bumps the version, runs
# `npm run format` and `npm run check`, builds lib/, commits "chore: release vX.Y.Z", tags it,
# pushes, publishes to npm and creates the GitHub release (notes generated by GitHub).
#
# npm trusted publishing (OIDC): no NPM_TOKEN. On npmjs.com, the package's settings must name
# this repository and this workflow file (release.yml) as a trusted publisher. npm then also
# records provenance. Pushing the release commit to a protected main uses a deploy key with
# write access, stored as the DEPLOY_KEY secret (as in v1).
name: Release
on:
  workflow_dispatch:
    inputs:
      increment:
        type: choice
        description: Version increment (from 2.0.0-alpha.x, "major" gives 2.0.0)
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        type: choice
        description: Pre-release id (only with "prerelease"; published under that npm dist-tag)
        options:
          - alpha
          - beta
          - rc

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag, GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          PREID: ${{ inputs.preid }}
        run: |
          if [ "$INCREMENT" = "prerelease" ]; then
            npx release-it --ci --preRelease="$PREID"
          else
            npx release-it "$INCREMENT" --ci
          fi

# Release & publish @gavdi/cap-mcp to npm (ported from v1's release workflow).
#
# Run by hand from the Actions tab ("Run workflow") on main. release-it bumps the version, runs
# format, typecheck, lint, the tests with coverage and the conformance suite, builds lib/,
# publishes to npm, then commits "chore: release vX.Y.Z", tags it, pushes, and creates the
# GitHub release (notes generated by GitHub). npm comes before git in release-it, so a rejected
# push leaves a published version without its tag: make the first run a prerelease.
#
# A stable version (npm dist-tag `latest`) needs the "stable" box ticked. From a prerelease
# such as 2.0.0-alpha.0, patch, minor and major all give 2.0.0.
#
# npm trusted publishing (OIDC): no NPM_TOKEN. On npmjs.com, the package's trusted publisher
# entry must name the final GitHub repository (not decided yet, see docs/backlog.md M7) and this
# workflow file (release.yml). npm then also records provenance, which needs package.json
# `repository` to match that repository. Pushing the release commit to a protected main uses a
# deploy key with write access, stored as the DEPLOY_KEY secret (as in v1).
name: Release
on:
  workflow_dispatch:
    inputs:
      increment:
        type: choice
        description: Version increment
        options:
          - prerelease
          - patch
          - minor
          - major
      preid:
        type: choice
        description: Pre-release id (with "prerelease"; also the npm dist-tag)
        options:
          - alpha
          - beta
          - rc
      stable:
        type: boolean
        description: Publish a stable version as npm "latest" (needed for patch, minor, major)
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag, GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Check the inputs and the package
        env:
          INCREMENT: ${{ inputs.increment }}
          STABLE: ${{ inputs.stable }}
        run: |
          if [ "$INCREMENT" != "prerelease" ] && [ "$STABLE" != "true" ]; then
            echo "::error::$INCREMENT publishes a stable version as npm 'latest'; tick 'stable' to confirm"
            exit 1
          fi
          if [ "$INCREMENT" = "prerelease" ] && [ "$STABLE" = "true" ]; then
            echo "::error::'stable' does not go with a prerelease"
            exit 1
          fi
          # Provenance is checked against package.json repository (docs/backlog.md M7).
          if ! node -e 'process.exit(require("./package.json").repository ? 0 : 1)'; then
            echo "::error::package.json has no repository; npm rejects provenance without it"
            exit 1
          fi

      # No dependency cache in the job that holds the deploy key and the OIDC token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Pinned.
      - run: npm install -g npm@11.21.2

      - run: npm ci

      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          PREID: ${{ inputs.preid }}
        run: |
          if [ "$INCREMENT" = "prerelease" ]; then
            npx release-it --ci --preRelease="$PREID"
          else
            npx release-it "$INCREMENT" --ci
          fi
